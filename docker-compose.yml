services:
  mysql:
    image: mysql:8.4
    container_name: ilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ilot
      MYSQL_USER: ilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ilot_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "3307:3306"
    volumes:
      - workspan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ilot
      PMA_PASSWORD: ${MYSQL_PASSWORD:-ilot_local_password}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
  backend:
    build: ./ilot-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ilot
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ilot_local_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./ilot-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  workspan_mysql_data:
